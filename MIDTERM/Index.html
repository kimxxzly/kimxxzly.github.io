<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚔️ Demon Slayer</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      overflow-x: hidden;
      background: #0a0a0a;
    }

    .bg-void {
      position: fixed;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse at 15% 25%, rgba(25, 5, 5, 0.9) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 75%, rgba(10, 10, 30, 0.8) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 10%, rgba(40, 10, 10, 0.7) 0%, transparent 50%),
        linear-gradient(145deg, #0a0a0a 0%, #1a0d2e 30%, #0f0f23 70%, #05050a 100%);
      z-index: -11;
    }

    .bg-demon-flames {
      position: fixed;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 30% 15%, rgba(255, 40, 40, 0.25) 0%, transparent 35%),
        radial-gradient(circle at 70% 85%, rgba(255, 80, 80, 0.2) 0%, transparent 35%),
        radial-gradient(circle at 10% 60%, rgba(200, 20, 20, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 40%, rgba(255, 60, 60, 0.18) 0%, transparent 40%);
      animation: hellFlames 25s ease-in-out infinite;
      z-index: -10;
    }

    @keyframes hellFlames {

      0%,
      100% {
        opacity: 0.6;
        transform: scale(1);
      }

      25% {
        opacity: 0.9;
        transform: scale(1.02);
      }

      50% {
        opacity: 0.7;
        transform: scale(1.01);
      }

      75% {
        opacity: 0.85;
        transform: scale(1.03);
      }
    }

    .bg-demon-lightning {
      position: fixed;
      width: 100%;
      height: 100%;
      background-image:
        radial-gradient(ellipse 2% 2% at 20% 30%, rgba(255, 100, 100, 0.8) 0%, transparent 50%),
        radial-gradient(ellipse 1.5% 1.5% at 80% 70%, rgba(255, 150, 150, 0.7) 0%, transparent 50%),
        radial-gradient(ellipse 1% 1% at 50% 90%, rgba(200, 50, 50, 0.6) 0%, transparent 50%);
      animation: lightningFlicker 8s ease-in-out infinite;
      z-index: -9;
    }

    @keyframes lightningFlicker {

      0%,
      90%,
      100% {
        opacity: 0.1;
      }

      5%,
      95% {
        opacity: 0.6;
      }

      10% {
        opacity: 0.3;
      }
    }

    .bg-blood-veins {
      position: fixed;
      width: 100%;
      height: 100%;
      background-image:
        radial-gradient(ellipse 30% 20% at 25% 35%, rgba(100, 10, 10, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse 25% 15% at 75% 65%, rgba(120, 15, 15, 0.1) 0%, transparent 60%),
        radial-gradient(ellipse 20% 25% at 45% 80%, rgba(80, 5, 5, 0.08) 0%, transparent 70%);
      animation: veinPulse 15s ease-in-out infinite;
      z-index: -8;
    }

    @keyframes veinPulse {

      0%,
      100% {
        opacity: 0.4;
        transform: scale(1);
      }

      50% {
        opacity: 0.7;
        transform: scale(1.015);
      }
    }

    .demon-eye {
      position: fixed;
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, rgba(255, 0, 0, 0.9) 15%, rgba(150, 0, 0, 0.7) 30%, rgba(80, 0, 0, 0.4) 60%, transparent 80%);
      border-radius: 50%;
      animation: eyeStare 20s linear infinite;
      filter: blur(1px);
      z-index: -7;
    }

    @keyframes eyeStare {
      0% {
        transform: scale(1) rotate(0deg);
        opacity: 0.3;
      }

      10% {
        opacity: 0.8;
      }

      20% {
        transform: scale(1.2) rotate(180deg);
        opacity: 0.4;
      }

      30% {
        opacity: 0.7;
      }

      40% {
        transform: scale(0.9) rotate(360deg);
        opacity: 0.2;
      }

      100% {
        transform: scale(1) rotate(720deg);
        opacity: 0.3;
      }
    }

    .bg-steel-grid {
      position: fixed;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(rgba(100, 20, 20, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(100, 20, 20, 0.01) 1px, transparent 1px);
      background-size: 40px 40px, 40px 40px, 80px 80px, 80px 80px;
      animation: gridShift 60s linear infinite;
      z-index: -6;
    }

    @keyframes gridShift {
      0% {
        background-position: 0 0, 0 0, 0 0, 0 0;
      }

      100% {
        background-position: 40px 40px, 40px 40px, 80px 80px, 80px 80px;
      }
    }

    .smoke-dark {
      position: fixed;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(ellipse 60% 80% at 30% 40%, rgba(25, 8, 8, 0.15) 0%, transparent 70%),
        radial-gradient(ellipse 50% 60% at 70% 20%, rgba(15, 5, 5, 0.12) 0%, transparent 75%);
      animation: hellSmoke 120s linear infinite;
      z-index: -5;
    }

    .smoke-dark::before {
      content: '';
      position: absolute;
      top: 20%;
      left: 10%;
      width: 120%;
      height: 120%;
      background: radial-gradient(ellipse 40% 50% at 50% 60%, rgba(40, 10, 10, 0.08) 0%, transparent 80%);
      animation: hellSmoke 90s linear infinite reverse;
    }

    @keyframes hellSmoke {
      0% {
        transform: translateX(0%) translateY(0%) scale(1) rotate(0deg);
      }

      100% {
        transform: translateX(-30%) translateY(-20%) scale(1.15) rotate(5deg);
      }
    }

    .ember {
      position: fixed;
      width: 4px;
      height: 4px;
      background: radial-gradient(circle, #ff4444, #cc0000);
      border-radius: 50%;
      box-shadow: 0 0 8px #ff4444;
      animation: emberFloat 15s linear infinite;
      z-index: -4;
    }

    @keyframes emberFloat {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      90% {
        opacity: 1;
      }

      100% {
        transform: translateY(-20vh) scale(1.2);
        opacity: 0;
      }
    }

    .title {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(4rem, 8vw, 6.5rem);
      text-align: center;
      margin: 3rem 0 2rem;
      background: linear-gradient(45deg, #ff4444, #cc0000, #990000, #ff6666);
      background-size: 400% 400%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: bloodFlow 3s ease infinite;
      text-shadow: 0 0 60px rgba(255, 68, 68, 0.8), 0 0 120px rgba(255, 0, 0, 0.4);
      letter-spacing: 8px;
    }

    @keyframes bloodFlow {

      0%,
      100% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }
    }

    .sidebar {
      position: sticky;
      top: 20px;
      height: fit-content;
      z-index: 20;
    }

    .home-link {
      display: block;
      background: linear-gradient(145deg, #ff4444, #cc0000, #990000);
      border: none;
      border-radius: 20px;
      padding: 16px 24px;
      font-weight: 700;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: white;
      width: 100%;
      margin-bottom: 2rem;
      box-shadow: 0 12px 35px rgba(255, 68, 68, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      overflow: hidden;
      text-decoration: none;
      text-align: center;
    }

    .home-link:hover {
      background: linear-gradient(145deg, #cc0000, #990000, #660000);
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 20px 50px rgba(255, 68, 68, 0.7), 0 0 30px rgba(255, 68, 68, 0.4);
      color: white;
      text-decoration: none;
    }

    .home-link::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.6s;
    }

    .home-link:hover::before {
      left: 100%;
    }

    .search-container {
      background: rgba(15, 15, 15, 0.98);
      backdrop-filter: blur(25px) saturate(1.2);
      border: 2px solid #333;
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 68, 68, 0.1);
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .search-container:hover {
      border-color: #ff4444;
      box-shadow:
        0 35px 80px rgba(255, 68, 68, 0.4),
        0 0 40px rgba(255, 68, 68, 0.2),
        inset 0 1px 0 rgba(255, 100, 100, 0.2);
    }

    .search-input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.1rem;
      padding: 18px 25px;
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .search-btn {
      background: linear-gradient(145deg, #ff4444, #cc0000, #990000);
      border: none;
      padding: 18px 25px;
      border-radius: 0 18px 18px 0;
      transition: all 0.4s ease;
      box-shadow: 0 8px 25px rgba(255, 68, 68, 0.4);
    }

    .search-btn:hover {
      background: linear-gradient(145deg, #cc0000, #990000, #660000);
      transform: scale(1.08) translateY(-2px);
      box-shadow: 0 15px 40px rgba(255, 68, 68, 0.6);
    }

    .card-animate {
      opacity: 0;
      transform: translateY(40px) scale(0.95);
      animation: cardReveal 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }

    @keyframes cardReveal {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card {
      border-radius: 20px;
      background: rgba(12, 12, 12, 0.98);
      border: 2px solid #2a2a2a;
      transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      height: 100%;
      backdrop-filter: blur(10px);
    }

    .card:hover {
      transform: translateY(-15px) scale(1.02);
      border-color: #ff4444;
      box-shadow:
        0 40px 80px rgba(255, 68, 68, 0.5),
        0 0 50px rgba(255, 68, 68, 0.3),
        inset 0 1px 0 rgba(255, 100, 100, 0.2);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 68, 68, 0.3), transparent);
      transition: left 0.8s;
      z-index: 1;
    }

    .card:hover::before {
      left: 100%;
    }

    .card img {
      height: 280px;
      object-fit: contain;
      transition: all 0.5s ease;
    }

    .card:hover img {
      transform: scale(1.08);
      filter: drop-shadow(0 20px 40px rgba(255, 68, 68, 0.6));
    }

    .id-badge {
      position: absolute;
      top: 15px;
      right: 15px;
      background: linear-gradient(145deg, #ff4444, #cc0000);
      color: white;
      padding: 8px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      box-shadow: 0 6px 20px rgba(255, 68, 68, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .type {
      padding: 8px 18px;
      border-radius: 25px;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .type.demon {
      background: linear-gradient(145deg, #ff4444, #cc0000);
      box-shadow: 0 0 20px rgba(255, 68, 68, 0.7);
    }

    .type.human {
      background: linear-gradient(145deg, #00aaff, #0066cc);
      box-shadow: 0 0 20px rgba(0, 170, 255, 0.6);
    }

    .type.hashira {
      background: linear-gradient(145deg, #ffd700, #ffaa00);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
    }

    .stats-bar {
      height: 12px;
      background: #2a2a2a;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .stats-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff4444, #cc0000, #ff6666, #ff4444);
      transition: width 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      box-shadow: 0 0 15px rgba(255, 68, 68, 0.6);
    }

    .stats-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      animation: shine 2s infinite;
    }

    @keyframes shine {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(100%);
      }
    }

    .modal-content {
      background: rgba(8, 8, 8, 0.99);
      border: 3px solid #ff4444;
      border-radius: 25px;
      box-shadow:
        0 60px 120px rgba(255, 68, 68, 0.5),
        0 0 80px rgba(255, 68, 68, 0.3),
        inset 0 1px 0 rgba(255, 100, 100, 0.1);
      backdrop-filter: blur(20px);
    }

    .modal-title {
      font-family: 'Bebas Neue', cursive;
      font-size: 2.5rem;
      color: #ff4444;
      text-shadow: 0 0 30px rgba(255, 68, 68, 0.8), 0 0 60px rgba(255, 0, 0, 0.4);
      letter-spacing: 3px;
    }

    .type-filter.active {
      background: linear-gradient(145deg, #ff4444, #cc0000) !important;
      color: white !important;
      box-shadow: 0 0 20px rgba(255, 68, 68, 0.7) !important;
      transform: scale(1.05);
    }

    @media (max-width: 992px) {
      .sidebar {
        position: static;
        margin-bottom: 2rem;
      }

      .main-content {
        order: 1;
      }
    }

    @media (max-width:768px) {
      .title {
        font-size: 3rem;
        margin: 2rem 0;
      }

      .card img {
        height: 240px;
      }

      .home-link {
        font-size: 1rem;
        padding: 14px 20px;
      }
    }
  </style>
</head>

<body>
  <div class="bg-void"></div>
  <div class="bg-demon-flames"></div>
  <div class="bg-demon-lightning"></div>
  <div class="bg-blood-veins"></div>
  <div class="bg-steel-grid"></div>
  <div class="smoke-dark"></div>

  <div class="demon-eye" style="left:15%; animation-delay:0s;"></div>
  <div class="demon-eye" style="left:75%; animation-delay:-8s; top:60%;"></div>
  <div class="demon-eye" style="left:45%; animation-delay:-15s; top:20%;"></div>


  <div class="row">
    <div class="col-lg-3 col-md-4 col-12 sidebar">
      <a href="HOMPAGE.html" class="home-link">
        <i class="fas fa-home me-2"></i>Back to Home
      </a>

      <div class="search-container p-0">
        <div class="d-flex">
          <input type="text" id="searchInput" class="search-input flex-grow-1"
            placeholder="🔍 Search by Name, ID, Role, Type..." onkeyup="searchCharacters()">
          <button class="search-btn" onclick="searchCharacters()">
            <i class="fas fa-search"></i>
          </button>
        </div>
      </div>

      <div class="mt-4 p-4 bg-dark bg-opacity-60 rounded-3 border border-secondary">
        <h6 class="fw-bold text-danger mb-3"><i class="fas fa-filter me-2"></i>FILTER BY TYPE</h6>
        <div class="d-flex flex-wrap gap-2">
          <button class="btn btn-outline-danger btn-sm px-4 py-2 fw-bold type-filter active"
            data-type="all">ALL</button>
          <button class="btn btn-outline-danger btn-sm px-4 py-2 fw-bold type-filter" data-type="human">HUMAN</button>
          <button class="btn btn-outline-danger btn-sm px-4 py-2 fw-bold type-filter" data-type="demon">DEMON</button>
          <button class="btn btn-outline-warning btn-sm px-4 py-2 fw-bold type-filter"
            data-type="hashira">HASHIRA</button>
        </div>
      </div>
    </div>

    <div class="col-lg-9 col-md-8 col-12 main-content">
      <div class="row g-4" id="characterGrid"></div>
    </div>

    <div class="modal fade" id="characterModal" tabindex="-1">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title mb-0" id="modalName"></h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-5">
            <div class="row">
              <div class="col-lg-4 text-center mb-4 mb-lg-0">
                <img id="modalImage" class="img-fluid rounded-4 shadow-lg"
                  style="max-height: 450px; object-fit: contain;" alt="Character">
                <div id="modalType" class="type mt-4 d-inline-block px-5 py-3 rounded-pill fw-bold fs-5"></div>
              </div>
              <div class="col-lg-8">
                <div class="row mb-5">
                  <div class="col-md-6">
                    <h6 class="fw-bold text-danger fs-5"><i class="fas fa-sword me-2"></i>ROLE</h6>
                    <p class="fs-4 mb-0 fw-bold" id="modalRole"></p>
                  </div>
                  <div class="col-md-6">
                    <h6 class="fw-bold text-primary fs-5"><i class="fas fa-lungs me-2"></i>BREATHING</h6>
                    <p class="fs-4 mb-0 fw-bold" id="modalBreathing">-</p>
                  </div>
                </div>

                <h5 class="fw-bold text-danger mb-5 border-bottom pb-3 border-3 border-danger"><i
                    class="fas fa-chart-bar me-2"></i>COMBAT STATS</h5>
                <div class="row mb-5 g-4">
                  <div class="col-md-6">
                    <div class="fs-5 fw-bold mb-2">Strength</div>
                    <div class="stats-bar mb-2">
                      <div class="stats-fill" id="strengthBar" style="width:0%"></div>
                    </div>
                    <span id="strengthValue" class="fs-5 fw-bold">0</span>
                  </div>
                  <div class="col-md-6">
                    <div class="fs-5 fw-bold mb-2">Speed</div>
                    <div class="stats-bar mb-2">
                      <div class="stats-fill" id="speedBar" style="width:0%"></div>
                    </div>
                    <span id="speedValue" class="fs-5 fw-bold">0</span>
                  </div>
                  <div class="col-md-6">
                    <div class="fs-5 fw-bold mb-2">Endurance</div>
                    <div class="stats-bar mb-2">
                      <div class="stats-fill" id="enduranceBar" style="width:0%"></div>
                    </div>
                    <span id="enduranceValue" class="fs-5 fw-bold">0</span>
                  </div>
                  <div class="col-md-6">
                    <div class="fs-5 fw-bold mb-2">Power</div>
                    <div class="stats-bar mb-2">
                      <div class="stats-fill" id="powerBar" style="width:0%"></div>
                    </div>
                    <span id="powerValue" class="fs-5 fw-bold">0</span>
                  </div>
                </div>

                <h5 class="fw-bold text-warning mb-4 border-bottom pb-3 border-3 border-warning"><i
                    class="fas fa-magic me-2"></i>ABILITIES</h5>
                <div id="modalAbilities" class="mb-5"></div>

                <h5 class="fw-bold text-info mb-4 fs-4"><i class="fas fa-quote-left me-2"></i>BATTLE CRY</h5>
                <blockquote class="border-start border-danger border-5 ps-5 py-4 bg-dark bg-opacity-25 rounded-4"
                  id="modalQuote" style="font-size:1.3rem; font-style:italic;">
                  "Prepare to be SLAYED!"
                </blockquote>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>

    let currentFilter = 'all';
    const characterGrid = document.getElementById('characterGrid');
    const modal = new bootstrap.Modal(document.getElementById('characterModal'));

    function renderCharacters(characters) {
      characterGrid.innerHTML = '';

      characters.forEach(character => {
        const col = document.createElement('div');
        col.className = 'col-xl-4 col-lg-6 col-md-6 col-sm-6';
        col.innerHTML = `
          <div class="card card-animate h-100 text-center p-4" 
               style="animation-delay:${character.id * 0.1}s"
               onclick="openCharacterModal(${character.id})">
            <div class="position-relative">
              <img src="${character.image}" class="w-100 rounded-4" 
                   onerror="this.src='https://via.placeholder.com/300x280/1a0d2e/ff4444?text=${character.name.charAt(0)}'" 
                   loading="lazy">
              <div class="id-badge">${String(character.id).padStart(2, '0')}</div>
            </div>
            <div class="card-body pt-4 pb-0">
              <h5 class="card-title fw-bold mb-3 fs-4">${character.name}</h5>
              <div class="type ${character.type} px-4 py-2 mb-3 d-inline-block">${character.type.toUpperCase()}</div>
              <div class="text-muted small lh-lg">${character.role}</div>
            </div>
          </div>
        `;
        characterGrid.appendChild(col);
      });
    }

    function searchCharacters() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      let filtered = demonSlayerData.characters.filter(char =>
        char.name.toLowerCase().includes(query) ||
        char.role.toLowerCase().includes(query) ||
        char.breathing.toLowerCase().includes(query) ||
        String(char.id).includes(query) ||  // ← ADD MO LANG 'TO
        char.type.toLowerCase().includes(query)  // ← OPTIONAL: para ma-search din yung type
      );

      if (currentFilter !== 'all') {
        filtered = filtered.filter(char => char.type === currentFilter);
      }

      renderCharacters(filtered);
    }

    document.querySelectorAll('.type-filter').forEach(btn => {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.type-filter').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.dataset.type;
        searchCharacters();
      });
    });

    function openCharacterModal(id) {
      const character = demonSlayerData.characters.find(c => c.id === id);

      document.getElementById('modalName').textContent = character.name;
      document.getElementById('modalRole').textContent = character.role;
      document.getElementById('modalBreathing').textContent = character.breathing;
      document.getElementById('modalImage').src = character.image;
      document.getElementById('modalQuote').textContent = character.quote;

      const typeEl = document.getElementById('modalType');
      typeEl.textContent = character.type.toUpperCase();
      typeEl.className = `type ${character.type} px-5 py-3 rounded-pill fw-bold fs-5`;

      ['strength', 'speed', 'endurance', 'power'].forEach(stat => {
        const bar = document.getElementById(stat + 'Bar');
        const value = document.getElementById(stat + 'Value');
        const statValue = character.stats[stat];
        bar.style.width = statValue + '%';
        value.textContent = statValue;
      });

      const abilitiesEl = document.getElementById('modalAbilities');
      abilitiesEl.innerHTML = character.abilities.map(ability =>
        `<span class="badge bg-dark text-danger me-3 mb-3 px-4 py-3 fs-6 fw-bold border border-danger rounded-pill">${ability}</span>`
      ).join('');

      modal.show();
    }

    document.addEventListener('DOMContentLoaded', function () {
      renderCharacters(demonSlayerData.characters);

      setInterval(() => {
        const ember = document.createElement('div');
        ember.className = 'ember';
        ember.style.left = Math.random() * 100 + '%';
        ember.style.animationDuration = (Math.random() * 10 + 10) + 's';
        ember.style.animationDelay = Math.random() * 2 + 's';
        document.body.appendChild(ember);
        setTimeout(() => ember.remove(), 20000);
      }, 800);
    });
  </script>
</body>

</html>
